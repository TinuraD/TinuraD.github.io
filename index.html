<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinura Dinith</title>
    <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/87059430?v=4">
    <link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/87059430?v=4">
    <link rel="stylesheet" href="styles.css">
    <script src="js/theme.js" defer></script>
</head>

<body class="min-h-screen">

    <header class="glass-header animate-fade-in">
        <div class="max-w-5xl mx-auto px-6 h-24 flex justify-between items-center">
            <div class="flex items-center gap-4 group cursor-pointer">
                <div class="relative">
                    <img src="https://avatars.githubusercontent.com/u/87059430?v=4" alt="Tinura Dinith"
                        class="w-12 h-12 rounded-full border-2 border-brand-primary/20 group-hover:border-brand-primary transition-colors duration-500">
                    <div
                        class="absolute inset-0 rounded-full bg-brand-primary/10 scale-0 group-hover:scale-125 transition-transform duration-500">
                    </div>
                </div>
                <span
                    class="font-bold tracking-tighter text-xl hidden sm:block bg-clip-text text-transparent bg-gradient-to-r from-brand-primary to-brand-tertiary">Tinura
                    Dinith</span>
            </div>
            <button id="theme-toggle" class="m3-button btn-primary group">
                <span class="dark-icon group-hover:rotate-12 transition-transform">🌙 <span
                        class="hidden sm:inline">Dark</span></span>
                <span class="light-icon hidden group-hover:rotate-45 transition-transform">☀️ <span
                        class="hidden sm:inline">Light</span></span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 pt-48 pb-24 space-y-24">
        <section class="space-y-8 animate-scale-up">
            <div class="space-y-2">
                <span
                    class="text-brand-primary font-bold tracking-widest uppercase text-sm animate-fade-in stagger-1">Hello
                    I'm,</span>
                <h1 class="text-7xl sm:text-9xl font-bold tracking-tighter leading-[0.9] animate-fade-in stagger-2">
                    Tinura<br><span class="text-brand-primary">Dinith</span>
                </h1>
            </div>
            <p class="text-2xl sm:text-4xl font-light leading-tight opacity-90 max-w-2xl animate-fade-in stagger-3">
                Crafting robust experiences with <span
                    class="font-medium border-b-2 border-brand-primary/30">Kotlin</span>,
                <span class="font-medium border-b-2 border-brand-secondary/30">Flutter</span>, and
                <span class="font-medium border-b-2 border-brand-tertiary/30">Python</span>.
            </p>
        </section>

        <section class="grid grid-cols-1 sm:grid-cols-2 gap-8 animate-slide-up stagger-3">

            <a href="https://github.com/TinuraD" target="_blank" class="m3-card group relative overflow-hidden">
                <div class="absolute top-0 right-0 p-6 opacity-10 group-hover:opacity-20 transition-opacity text-6xl">💻
                </div>
                <div class="space-y-6 relative z-10">
                    <div
                        class="w-14 h-14 rounded-2xl bg-brand-surface-container flex items-center justify-center text-3xl group-hover:rotate-[-6deg] transition-transform duration-500">
                        🚀
                    </div>
                    <div>
                        <h2 class="text-3xl font-bold tracking-tight">GitHub</h2>
                        <p class="text-lg opacity-60 font-light">Open source contributions & logic.</p>
                    </div>
                    <div
                        class="flex items-center gap-2 text-brand-secondary font-bold text-sm uppercase tracking-widest">
                        View Code <span class="group-hover:translate-x-2 transition-transform">→</span>
                    </div>
                </div>
            </a>
        </section>
    </main>

    <footer class="py-16 border-t border-brand-on-surface/5 text-center">
        <p class="text-sm font-semibold tracking-widest uppercase opacity-40">Developed with ❤️ by Tinura Dinith</p>
    </footer>

</body>

</html>
