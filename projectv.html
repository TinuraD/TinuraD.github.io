<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectV | Future of Media</title>
    <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/87059430?v=4">
    <link rel="stylesheet" href="styles.css">
    <script src="js/theme.js" defer></script>
</head>

<body class="min-h-screen">

    <header class="glass-header animate-fade-in">
        <div class="max-w-5xl mx-auto px-6 h-24 flex justify-between items-center">
            <a href="index.html" class="m3-button btn-primary group">
                <span class="group-hover:-translate-x-1 transition-transform">←</span> Home
            </a>
            <button id="theme-toggle" class="m3-button btn-primary group">
                <span class="dark-icon group-hover:rotate-12 transition-transform">🌙 <span
                        class="hidden sm:inline">Dark</span></span>
                <span class="light-icon hidden group-hover:rotate-45 transition-transform">☀️ <span
                        class="hidden sm:inline">Light</span></span>
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 pt-48 pb-24 text-center space-y-16 animate-scale-up">
        <div class="space-y-10">
            <div class="relative inline-block group">
                <div
                    class="absolute inset-0 bg-brand-primary blur-3xl opacity-20 group-hover:opacity-40 transition-opacity">
                </div>
                <img src="https://avatars.githubusercontent.com/u/87059430?v=4" alt="ProjectV"
                    class="w-32 h-32 mx-auto rounded-[2rem] shadow-2xl relative z-10 hover:rotate-3 transition-transform duration-500">
                <div
                    class="absolute -bottom-4 -right-4 bg-brand-primary text-brand-on-primary w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-black ring-8 ring-brand-bg z-20 shadow-lg">
                    V
                </div>
            </div>

            <div class="space-y-4">
                <h1 class="text-6xl sm:text-8xl font-black tracking-tighter">ProjectV</h1>
                <p class="text-2xl sm:text-3xl font-light opacity-80 max-w-xl mx-auto leading-relaxed">
                    An upcoming media player experience for Windows & Android.
                </p>
            </div>

            <div
                class="inline-flex items-center gap-4 px-8 py-3 bg-brand-primary-container text-brand-on-primary-container rounded-full text-base font-bold uppercase tracking-[0.2em] shadow-inner">
                <span class="relative flex h-3 w-3">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-primary opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-brand-primary"></span>
                </span>
                Under Development
            </div>
        </div>

        <div class="pt-12 animate-fade-in stagger-3">
            <div
                class="p-1 px-4 border border-brand-on-surface/10 rounded-full inline-block text-xs font-bold opacity-30 tracking-widest uppercase">
                Stay Tuned
            </div>
        </div>
    </main>

    <footer class="py-16 border-t border-brand-on-surface/5 text-center">
        <p class="text-sm font-semibold tracking-widest uppercase opacity-40">Developed with ❤️ by Tinura Dinith</p>
    </footer>

</body>

</html>
